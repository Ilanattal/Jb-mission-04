<div class="container">
    <h2>Ajouter une opération</h2>
  
    <form (ngSubmit)="submitOperation()">
  
      <label>Numéro de compte :</label>
      <input type="text" [(ngModel)]="operation.accountNumber" name="accountNumber" required />
  
      <label>Type d'opération :</label>
      <select [(ngModel)]="operation.type" name="type" required>
        <option value="">-- Choisir --</option>
        <option value="deposit">Dépôt</option>
        <option value="withdrawal">Retrait</option>
        <option value="loan">Prêt</option>
      </select>
  
      <!-- Champs communs -->
      <label>Montant :</label>
      <input type="number" [(ngModel)]="operation.amount" name="amount" required />
  
      <!-- Champs spécifiques au prêt -->
      <div *ngIf="operation.type === 'loan'">
        <label>Intérêt :</label>
        <input type="number" [(ngModel)]="operation.interest" name="interest" required />
  
        <label>Nombre de paiements :</label>
        <input type="number" [(ngModel)]="operation.payments" name="payments" required />
  
        <label>Date du prêt :</label>
        <input type="date" [(ngModel)]="operation.loanDate" name="loanDate" required />
      </div>
  
      <button type="submit">Ajouter l'opération</button>
    </form>
  </div>
